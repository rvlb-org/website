<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seL4-Vault - دليل النظام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020408;
  --surface: rgba(8, 13, 20, 0.7);
  --surface2: rgba(13, 21, 32, 0.8);
  --border: rgba(26, 42, 58, 0.5);
  --accent: #00d4ff;
  --accent-glow: rgba(0, 212, 255, 0.2);
  --accent2: #ff6b35;
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Tajawal', sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(0, 212, 255, 0.05), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(255, 107, 53, 0.05), transparent 25%);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  overflow: hidden;
}
.app-container { display: flex; width: 100%; height: 100%; padding: 20px; gap: 20px; }
.sidebar {
  width: 300px; background: var(--surface); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 20px; display: flex;
  flex-direction: column; padding: 24px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37);
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: var(--bg); box-shadow: 0 0 20px var(--accent-glow); }
.brand-title { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
.nav-section { margin-bottom: 16px; color: var(--text-muted); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
.nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.nav-item { padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-weight: 500; }
.nav-item:hover { background: var(--surface2); color: var(--text-main); transform: translateX(-5px); }
.nav-item.active { background: rgba(0, 212, 255, 0.1); color: var(--accent); border-right: 3px solid var(--accent); }
.main-content { flex: 1; background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 40px; overflow-y: auto; position: relative; }
.content-section { display: none; }
.content-section.active { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.md-title { font-size: 42px; font-weight: 900; margin-bottom: 10px; background: linear-gradient(to left, var(--text-main), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.md-body { line-height: 1.8; font-size: 18px; color: var(--text-muted); }
.md-body h1 { color: var(--text-main); margin: 30px 0 20px 0; font-size: 32px; }
.md-body h2 { color: var(--text-main); margin: 40px 0 20px 0; font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
</style>
<script>
  function showSection(id) {
    var sections = document.getElementsByClassName('content-section');
    for (var i = 0; i < sections.length; i++) {
      sections[i].classList.remove('active');
    }
    document.getElementById('section-' + id).classList.add('active');

    var navItems = document.getElementsByClassName('nav-item');
    for (var i = 0; i < navItems.length; i++) {
      navItems[i].classList.remove('active');
    }
    document.getElementById('nav-' + id).classList.add('active');
  }
</script>

<style>
  /* ═══ RVLB THEME OVERRIDE ═══ */
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg:         #030303;
    --surface:    #0d0d0d;
    --surface2:   #141414;
    --border:     rgba(255,255,255,0.07);
    --accent:     #00d4ff;
    --accent2:    #ff6b35;
    --text-main:  #e8e8e8;
    --text-muted: #888;
    --radius:     14px;
    --glow:       0 0 30px rgba(0,212,255,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── شريط التنقل العلوي ── */
  .rvlb-topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(3,3,3,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 9999;
    gap: 16px;
  }
  .rvlb-topbar-logo {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .rvlb-topbar-title {
    font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rvlb-topbar-back {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 5px 14px;
    border-radius: 8px;
    white-space: nowrap;
    transition: all 0.25s;
  }
  .rvlb-topbar-back:hover {
    background: var(--accent);
    color: #000;
  }

  /* ── تعديل الـ body padding ── */
  body > *:not(.rvlb-topbar) { padding-top: 56px !important; }

  /* ── بطاقات وعناصر ── */
  pre, code {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: #a8ff78;
    padding: 2px 8px;
  }
  pre { padding: 16px; overflow-x: auto; line-height: 1.7; }
  pre code { background: none; border: none; padding: 0; }

  h1, h2, h3, h4 {
    font-family: 'Cairo', sans-serif;
    color: var(--text-main);
    line-height: 1.4;
  }
  h1 { font-size: 2rem; font-weight: 900; margin-bottom: 16px; }
  h2 { font-size: 1.4rem; font-weight: 800; margin: 24px 0 12px; color: var(--accent); }
  h3 { font-size: 1.1rem; font-weight: 700; margin: 16px 0 8px; }

  p { line-height: 1.8; color: var(--text-muted); margin-bottom: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  strong { color: var(--text-main); font-weight: 700; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
  }
  th {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 10px 16px;
    text-align: right;
    color: var(--accent);
    font-weight: 700;
  }
  td {
    border: 1px solid var(--border);
    padding: 10px 16px;
    color: var(--text-muted);
  }
  tr:hover td { background: rgba(255,255,255,0.02); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>

</head>
<body>

<div class="rvlb-topbar">
  <a href="https://rvlb.org" class="rvlb-topbar-logo" target="_blank">RVLB</a>
  <span class="rvlb-topbar-title">Hisn-seL4 — التوثيق الفني</span>
  <a href="/hisn/" class="rvlb-topbar-back">← الرئيسية</a>
</div>

<div class="app-container">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">V</div>
      <div class="brand-title">Vault Docs</div>
    </div>
    <ul class="nav-list" id="nav-list">
      <!-- {{NAV_LINKS}} -->
    </ul>
  </aside>
  <main class="main-content">
    <!-- {{CONTENT_SECTIONS}} -->
  </main>
</div>
</body>
</html>
