<p>تعريف هيكل <code>IpcMessage</code> الكامل: badge للأمان، tag لنوع الطلب، أربع كلمات MR0..MR3 تُرسَل بشكل فوري عبر سجلات المعالج، وحمولة بايتية بحجم 128 بايت للبيانات الكبيرة. يوفر مُنشئات مريحة مثل <code>ok()</code> و <code>error(code)</code> و <code>with_payload</code>، ومجموعة من Unit Tests التحقق من صحة الـ Roundtrip والحمولة.</p>
