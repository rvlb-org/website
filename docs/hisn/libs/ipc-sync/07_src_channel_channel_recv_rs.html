<p>ينفذ <code>recv</code>، <code>send</code>، <code>send_nb</code> (Non-Blocking)، و <code>into_sender</code>/<code>into_receiver</code> كـ methods على <code>Channel</code>. دالة <code>send_nb</code> مثالية لإرسال أحداث الـ IRQ أو الـ Mouse Events دون تعليق حلقة المعالجة في حال لم يكن المستقبل جاهزاً.</p>
