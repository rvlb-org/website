<p>تعريف <code>Receiver</code> وحلقة <code>serve()</code> اللانهائية — قلب نمط الخادم في النظام. تستقبل أول رسالة بـ <code>seL4_Wait</code> وبعدها تستخدم <code>seL4_ReplyRecv</code> الذري (رد + انتظار في خطوة واحدة) لتحقيق أقصى كفاءة. المطور يمرر <code>closure</code> معالِج (handler) يُعالج كل رسالة ويُعيد الرد بشكل نظيف تماماً دون الاهتمام بتفاصيل IPC.</p>
