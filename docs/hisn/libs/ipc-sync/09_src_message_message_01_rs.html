<p>يُعرّف قاموس الرسائل الكامل عبر <code>MessageTag</code> — تعداد يغطي <strong>جميع</strong> أنواع الطلبات في النظام: إدارة الذاكرة، التشفير/فك التشفير، عمليات الملفات والمجلدات، اختصارات سطح المكتب، الحافظة، أحداث الإدخال (Mouse/Keyboard)، وطلبات الشبكة عبر Tor. يُعرّف أيضاً <code>IpcError</code> مع أربعة حالات وصفية.</p>
