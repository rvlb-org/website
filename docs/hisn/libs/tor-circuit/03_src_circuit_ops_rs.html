<p>Extension methods على <code>Circuit</code>: <code>destroy_cell()</code> لإنتاج خلية <code>Destroy</code> لإغلاق الدائرة بشكل نظيف، و<code>begin_stream()</code>/<code>send_data()</code>/<code>end_stream()</code> التي تبني خلايا <code>RelayCell</code> كاملة (مع البيانات مُعبَّأة في الـ Payload) ثم تُمررها عبر Onion Encryption.</p>
