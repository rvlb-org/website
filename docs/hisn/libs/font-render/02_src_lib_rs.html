<p>البوابة الرئيسية. تستدعي ملف <code>font8x16.bin</code> الثنائي عبر <code>include_bytes!</code>. تُعرّف دالة <code>font_row()</code> لقراءة صفوف البكسلات لكل حرف ASCII (من 0x20 إلى 0x7E). وتُنفذ الدالتين الأساسيتين: <code>draw_char</code> (رسم حرف عادي) و <code>draw_char_scaled</code> (رسم الحرف بحجم مضاعف عبر <code>fill_rect</code>).</p>
