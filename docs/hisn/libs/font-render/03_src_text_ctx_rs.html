<p>يُعرّف <code>TextContext</code> — سياق كتابة متقدم يتتبع موضع المؤشر (X, Y)، الهوامش، المقياس، والألوان. يُوفر دوال مريحة مثل <code>print()</code> و <code>newline()</code> لطباعة النصوص الطويلة مع دعم الالتفاف التلقائي (Word Wrap). كما يتضمن <code>FixedStr</code> لتحويل الأرقام (عشري وست عشري) إلى نصوص بدون تخصيص ذاكرة (No Allocation).</p>
