<p>البوابة الرئيسية للمكتبة. تُصدر الثلاثة وحدات الجوهرية وتُعيد تصدير الأنواع الأكثر استخداماً مباشرةً. يحتوي على ضمانات الأمان المُوثَّقة: لا <code>unsafe</code> غير مبررة، مقارنة <em>constant-time</em> للتاغات لمنع هجمات التوقيت (Timing Attacks)، وتطبيق مبدأ <em>Verify-then-Decrypt</em> الصارم.</p>
