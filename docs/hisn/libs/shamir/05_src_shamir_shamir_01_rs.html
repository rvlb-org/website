<p>يعرّف الأنواع الأساسية للمكتبة: ثوابت الحدود (<code>MAX_SHARES=255</code>، <code>MAX_SECRET_LEN=64</code> — قُلِّص من 521 إلى 64 لمنع stack overflow في Crypto_Vault)، تعداد الأخطاء <code>ShamirError</code> بستة حالات وصفية، وهيكل <code>Share</code> الذي يحمل قيمة <code>x</code> الفريدة وبيانات <code>f(x)</code> لكل بايت من السر.</p>
