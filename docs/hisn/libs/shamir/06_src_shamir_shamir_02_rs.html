<p>ينفّذ دالة <code>split()</code>: تبني متعدد حدود عشوائياً من الدرجة k-1 لكل بايت من السر عبر مصدر عشوائي خارجي (<code>rng</code>) مما يفصل المكتبة عن مصدر العشوائية ويجعلها قابلة للاختبار. بعد انتهاء العملية تُمسح المعاملات السرية من الذاكرة فوراً باستخدام <code>write_volatile</code> لمنع كشفها بواسطة محسّنات المترجم.</p>
