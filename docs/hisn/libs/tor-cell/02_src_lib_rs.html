<p>يُعرّف التعدادات الكاملة <code>CellCmd</code> (أوامر مستوى الدائرة مثل <code>Create</code>، <code>Relay</code>، <code>Destroy</code>، <code>Versions</code>، <code>Create2</code>) و<code>RelayCmd</code> (أوامر مستوى البيانات مثل <code>Begin</code>، <code>Data</code>، <code>End</code>، <code>Extend2</code>). يُعرّف هيكل <code>Cell</code> بمخطط البايتات الدقيق (circuit_id 4B | cmd 1B | payload 509B) مع دوال <code>to_bytes</code> و<code>from_bytes</code> للتسلسل.</p>
