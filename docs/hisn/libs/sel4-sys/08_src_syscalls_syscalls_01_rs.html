<p>يحتوي على أرقام نداءات النظام الأساسية وتطبيقاتها عبر <strong>Inline Assembly</strong> صريح. يقدم واجهات التخاطب مع المعالج لإرسال الرسائل <code>Send</code>، وإعطاء الأولوية لمعالجة أخرى <code>Yield</code>، ودالة الطباعة السريعة <code>DebugPutChar</code>. يتم هنا معالجة تعقيدات مترجم <code>LLVM</code> مع سجل <code>rbx</code> لضمان عدم انهيار الـ Stack أثناء النداء.</p>
