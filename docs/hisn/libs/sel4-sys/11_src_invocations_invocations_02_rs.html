<p>مخصص بشكل كامل لإدارة <strong>صلاحيات الوصول (Capabilities)</strong> المخزنة داخل الـ <code>CNode</code>. يوفر الدوال <code>Copy</code> لنسخ الصلاحيات بين حاويات النظام، و <code>Mint</code> لنسخها مع تقليص حقوق الوصول أو إضافة <code>Badge</code> مميز للتعرف على هوية المرسل، ودالة <code>Delete</code> لإبطال وتدمير الصلاحية وتحرير الموارد.</p>
