<p>هذا الملف مسؤول عن تعريف <strong>أنواع البيانات الجوهرية (Type Aliases)</strong> مثل <code>seL4_Word</code> و <code>seL4_CPtr</code> لضمان توافق حجم الذاكرة مع معمارية <code>x86_64</code> (64-بت). كما يحتوي على الثوابت الصارمة لجميع كائنات النواة (Object Types) مثل <code>UntypedObject</code> و <code>TCBObject</code>، وأحجامها المحددة بالبت (Size Bits) لتمكين حجز الذاكرة الدقيق.</p>
