<p>مخصص لدوال الاستقبال والرد في نظام التواصل بين العمليات (IPC). يحتوي على دوال بالغة الأهمية مثل <code>seL4_Wait</code> (لانتظار رسالة من خيط آخر) و <code>seL4_ReplyRecv</code> (للرد على رسالة سابقة والانتظار لرسالة جديدة في خطوة ذرية واحدة Atomic Step) لتقليل وقت التبديل بين السياقات (Context Switch).</p>
