<p>
  <code>setup_tor_router()</code> — يُشغّل حاوية Tor بنفس النمط القياسي مع Scratch address: <code>0xA00000</code>. ملاحظة: لا توجد Capabilities إضافية تُمرَّر لـ Tor حالياً (الحاوية تُهيئ شبكتها بنفسها عبر smoltcp). نقطة التطوير المستقبلية: تمرير VirtIO-Net endpoint لتفعيل الشبكة الحقيقية.
